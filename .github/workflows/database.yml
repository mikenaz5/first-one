name: Database

# Runs the booking rules against a real Postgres: no double-booking (including 30 clients racing
# for one slot), working hours, blackouts, buffers, server-side pricing and row level security.

on:
  push:
    paths:
      - "ios/supabase/**"
      - ".github/workflows/database.yml"
  pull_request:
    paths:
      - "ios/supabase/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  booking-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - run: python ios/supabase/tests/booking_rules.py
