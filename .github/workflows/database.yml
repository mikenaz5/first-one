name: Database

# Runs the booking, payment and messaging rules against a real Postgres: no double-booking (including 30 clients racing
# for one slot), working hours, blackouts, buffers, server-side pricing, contracts, payments, refunds, conversations,
# the notification queue and row level security. Three more scripts cover company accounts: roles, invites, seats and who can
# see and change what; company services, assignment, contracts and the upgrade from one person; and seat billing. A second job type-checks and tests the Edge Function logic with Node (no Stripe or
# Apple account needed).

on:
  push:
    paths:
      - "ios/supabase/**"
      - "ios/SlateTests/Fixtures/**"
      - ".github/workflows/database.yml"
  pull_request:
    paths:
      - "ios/supabase/**"
      - "ios/SlateTests/Fixtures/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  booking-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - run: python ios/supabase/tests/booking_rules.py
      - run: python ios/supabase/tests/team_rules.py
      - run: python ios/supabase/tests/company_rules.py
      - run: python ios/supabase/tests/billing_rules.py
      - run: python ios/supabase/tests/search_rules.py
      - run: python ios/supabase/tests/featured_rules.py
      - run: python ios/supabase/tests/card_rules.py
      - run: python ios/supabase/tests/file_rules.py
      # The Swift decoders are tested against this file; it must keep the shape of what the functions return.
      - run: python ios/supabase/tests/dump_team_rows.py --check

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ios/supabase/function-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/supabase/function-tests/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
