name: TestFlight

# Builds Slate Pro for real iPhones and uploads it to App Store Connect, where TestFlight picks it up.
# It never runs by itself: open the Actions tab, choose "TestFlight", press "Run workflow".
# It needs an Apple Developer account and six secrets first. ios/docs/APP_STORE.md, step by step, says how to get each one.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version people see, such as 1.0.0. Leave empty to keep the one in ios/project.yml."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      # Required. Each one is a repository secret (Settings ▸ Secrets and variables ▸ Actions).
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      # Optional. Without these the build has no Apple Pay (everything else works).
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      APPLE_PAY_MERCHANT_ID: ${{ secrets.APPLE_PAY_MERCHANT_ID }}
      APP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check this is the branch with the app
        working-directory: .
        run: |
          if [ ! -d ios ]; then
            echo "::error::This branch has no app in it. When you press Run workflow, set 'Use workflow from' to claude/ecstatic-curie-4456ah first."
            exit 1
          fi

      - name: Check the secrets are all there
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets are not set:$missing. See ios/docs/APP_STORE.md, step 'Let GitHub upload builds for you'."
            exit 1
          fi
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*) echo "::error::SUPABASE_PUBLISHABLE_KEY holds a SECRET key. Use the publishable key (sb_publishable_...), never the secret one."; exit 1 ;;
          esac
          case "$STRIPE_PUBLISHABLE_KEY" in
            ""|pk_*) ;;
            *) echo "::error::STRIPE_PUBLISHABLE_KEY must start with pk_ (the publishable key). Never put a secret key (sk_...) in the app."; exit 1 ;;
          esac
          if [ -n "$STRIPE_PUBLISHABLE_KEY" ] && [ -z "$APPLE_PAY_MERCHANT_ID" ]; then
            echo "::error::STRIPE_PUBLISHABLE_KEY is set but APPLE_PAY_MERCHANT_ID is not. Set both for Apple Pay, or neither."
            exit 1
          fi

      - name: Check the Apple numbers look right
        run: |
          # A pasted value can carry a space or a line break at its end, and Apple then says "not authorized". Take those off,
          # and use the tidied copies (KEY_ID, ISSUER_ID, TEAM_ID) from here on.
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          # The tidied copies are not the exact saved text, so GitHub would not hide them in the log on its own.
          for v in "$KEY_ID" "$ISSUER_ID" "$TEAM_ID"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          {
            echo "KEY_ID=$KEY_ID"
            echo "ISSUER_ID=$ISSUER_ID"
            echo "TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"
          UUID='^[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$'
          TEN='^[A-Za-z0-9]{10}$'
          bad=0
          if ! printf '%s' "$KEY_ID" | grep -Eq "$TEN"; then
            echo "::error::ASC_KEY_ID should be 10 letters and numbers, the Key ID shown next to your key on App Store Connect (it is also in the file name: AuthKey_XXXXXXXXXX.p8). What is saved is ${#KEY_ID} characters long."
            bad=1
          fi
          if ! printf '%s' "$ISSUER_ID" | grep -Eq "$UUID"; then
            echo "::error::ASC_ISSUER_ID should be the long Issuer ID at the top of App Store Connect > Users and Access > Integrations > App Store Connect API, with dashes, like 69a6de7e-1234-47e3-e053-5b8c7c11a4d1. What is saved is ${#ISSUER_ID} characters long."
            bad=1
          fi
          if ! printf '%s' "$TEAM_ID" | grep -Eq "$TEN"; then
            echo "::error::APPLE_TEAM_ID should be 10 letters and numbers, the Team ID under Membership details on developer.apple.com/account. What is saved is ${#TEAM_ID} characters long."
            bad=1
          fi
          if printf '%s' "$KEY_ID" | grep -Eq "$UUID" && printf '%s' "$ISSUER_ID" | grep -Eq "$TEN"; then
            echo "::error::ASC_KEY_ID and ASC_ISSUER_ID look swapped: the long one with dashes is the Issuer ID."
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "The three Apple numbers have the right shape."

      - name: Check the product name and the privacy manifest
        run: |
          python3 scripts/check_product_name.py
          python3 scripts/check_privacy_manifest.py

      - name: Use the newest Xcode on this machine
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write the settings file (Secrets.xcconfig)
        run: |
          # "//" starts a comment in these files, so the address is written with the $() trick the example file explains.
          URL=$(printf '%s' "$SUPABASE_URL" | sed 's#^https://#https:/$()/#')
          {
            printf 'SUPABASE_URL = %s\n' "$URL"
            printf 'SUPABASE_ANON_KEY = %s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'DEVELOPMENT_TEAM = %s\n' "$TEAM_ID"
            if [ -n "$STRIPE_PUBLISHABLE_KEY" ]; then
              printf 'STRIPE_PUBLISHABLE_KEY = %s\n' "$STRIPE_PUBLISHABLE_KEY"
              printf 'APPLE_PAY_MERCHANT_ID = %s\n' "$APPLE_PAY_MERCHANT_ID"
              echo 'CODE_SIGN_ENTITLEMENTS = Config/Slate.ApplePay.Push.entitlements'
            else
              echo 'CODE_SIGN_ENTITLEMENTS = Config/Slate.Push.entitlements'
            fi
          } > Config/Secrets.xcconfig
          # Show the names only, never the values.
          sed -E 's/=.*/= (set)/' Config/Secrets.xcconfig

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Save the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          # Rebuild the key file from whatever was pasted. A paste can lose its line breaks or its first and last lines;
          # the key itself is the one block of letters and numbers between them, so put the frame back around it.
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----BEGIN [A-Z ]*-----//g' -e 's/-----END [A-Z ]*-----//g' | tr -d ' \n\t"')
          {
            echo '-----BEGIN PRIVATE KEY-----'
            printf '%s' "$BODY" | fold -w 64
            echo
            echo '-----END PRIVATE KEY-----'
          } > "$KEY"
          chmod 600 "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::The ASC_KEY_P8 secret is not a usable Apple key. Open the AuthKey_....p8 file in TextEdit, select all (Cmd A), copy (Cmd C), then on GitHub (Settings > Secrets and variables > Actions) click the pencil next to ASC_KEY_P8 and paste it over what is there."
            echo "What was saved: ${#ASC_KEY_P8} characters in all, ${#BODY} once the BEGIN and END lines and spaces are removed (a real Apple key has 184). It is not shown here."
            exit 1
          fi
          echo "The key is in the right shape."

      - name: Ask Apple whether the key works
        run: |
          KEY="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$KEY_ID" | b64url)
          PAYLOAD=$(printf '{"iss":"%s","iat":%s,"exp":%s,"aud":"appstoreconnect-v1"}' "$ISSUER_ID" "$NOW" "$((NOW + 600))" | b64url)
          # openssl signs in DER form; Apple wants the two 32-byte halves (r and s) side by side.
          SIGNATURE=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign "$KEY" | python3 -c '
          import sys, base64
          d = sys.stdin.buffer.read()
          i = 2 + (d[1] & 0x7F if d[1] & 0x80 else 0)
          rl = d[i + 1]; r = d[i + 2:i + 2 + rl]; i += 2 + rl
          sl = d[i + 1]; s = d[i + 2:i + 2 + sl]
          r = r.lstrip(b"\0").rjust(32, b"\0"); s = s.lstrip(b"\0").rjust(32, b"\0")
          sys.stdout.write(base64.urlsafe_b64encode(r + s).rstrip(b"=").decode())
          ')
          STATUS=$(curl -sS -m 30 -o "$RUNNER_TEMP/asc-apps.json" -w '%{http_code}' \
            -H "Authorization: Bearer $HEADER.$PAYLOAD.$SIGNATURE" \
            "https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=com.slateproapp.app&limit=1") || STATUS="none"
          case "$STATUS" in
            200)
              if grep -q '"type"[[:space:]]*:[[:space:]]*"apps"' "$RUNNER_TEMP/asc-apps.json"; then
                echo "Apple accepted the key, and the app com.slateproapp.app exists on App Store Connect."
              else
                echo "::warning::Apple accepted the key, but it found no app with the bundle ID com.slateproapp.app. Check that the app page was made with that bundle ID."
              fi ;;
            401)
              echo "::error::Apple does not accept this key (answer 401, not authorized). One of these three does not match the key you downloaded: ASC_KEY_ID (must be the Key ID of that same key; it is in the file name AuthKey_XXXXXXXXXX.p8), ASC_ISSUER_ID (the Issuer ID at the top of the Team Keys page, not the Key ID), or ASC_KEY_P8 (the contents of that same .p8 file). It also fails if the key was revoked, or if it is an Individual key instead of a Team key. Fix the secret, or make a new Team key and replace all three."
              exit 1 ;;
            403)
              echo "::error::Apple recognises the key but will not let it in (answer 403). Make the key with Admin access: App Store Connect > Users and Access > Integrations > App Store Connect API > Team Keys."
              exit 1 ;;
            *)
              echo "::warning::Could not check the key with Apple (answer $STATUS). Going on to the build, which will say more." ;;
          esac

      - name: Build the app
        run: |
          mkdir -p build
          EXTRA=""
          if [ -n "$APP_VERSION" ]; then EXTRA="MARKETING_VERSION=$APP_VERSION"; fi
          # The build number must go up every time App Store Connect gets a build; this run's number always does.
          xcodebuild archive \
            -project Slate.xcodeproj \
            -scheme Slate \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Slate.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            $EXTRA \
            > build/archive.log 2>&1 || { grep -E "error:" build/archive.log | sort -u | head -60; tail -n 60 build/archive.log; exit 1; }
          tail -n 5 build/archive.log

      - name: Upload to App Store Connect
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Slate.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            > build/export.log 2>&1 || { grep -E "error:|Error" build/export.log | sort -u | head -40; tail -n 60 build/export.log; exit 1; }
          tail -n 8 build/export.log
          echo "Uploaded build $GITHUB_RUN_NUMBER. It shows up in App Store Connect ▸ TestFlight in a few minutes, after Apple has processed it."

      - name: Remove the key from this machine
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" Config/Secrets.xcconfig

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ios/build/archive.log
            ios/build/export.log
          if-no-files-found: ignore
