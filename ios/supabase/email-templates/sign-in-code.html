<!--
  The email Slate Pro sends with a six-digit sign-in code. Paste everything BELOW this comment into BOTH templates in the
  Supabase dashboard, because a new address uses one and a returning address uses the other:
    Authentication > Emails > Confirm sign up
    Authentication > Emails > Magic link
  Give both the subject:  Your Slate Pro sign-in code
  Supabase's default templates send a link and no code, and the app asks for the code, so without this nobody can sign in.
  {{ .Token }} is the six digits; leave it exactly as it is. Supabase only lets you edit these once your own email sender is
  set up under Authentication > Emails > SMTP Settings (see README.md), which is also what makes the email come from
  Slate Pro rather than from Supabase.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3F1FA;padding:32px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#FFFFFF;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background:#1A1033;padding:22px 28px;color:#FFFFFF;font-size:20px;font-weight:700;letter-spacing:0.3px;">Slate Pro</td>
        </tr>
        <tr>
          <td style="padding:28px 28px 8px;color:#1A1033;font-size:22px;line-height:28px;font-weight:700;">Your sign-in code</td>
        </tr>
        <tr>
          <td style="padding:0 28px 22px;color:#4B476A;font-size:15px;line-height:22px;">Type this code into Slate Pro to sign in. It works for 10 minutes.</td>
        </tr>
        <tr>
          <td align="center" style="padding:0 28px 24px;">
            <div style="display:inline-block;background:#F3EEFF;border:1px solid #D9CCFF;border-radius:12px;padding:16px 26px;font-size:34px;line-height:40px;font-weight:700;letter-spacing:8px;color:#5B2BD6;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 28px;color:#6C688A;font-size:13px;line-height:19px;">If you didn't ask for this, you can ignore this email. Nobody can sign in to your account without the code.</td>
        </tr>
      </table>
      <p style="max-width:440px;margin:16px 0 0;color:#8A86A6;font-size:12px;line-height:18px;text-align:center;">Slate Pro &middot; slateproapp.com</p>
    </td>
  </tr>
</table>
