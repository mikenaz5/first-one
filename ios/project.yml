name: Slate

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
  # Only Apple Pay is used, from Stripe's smaller "StripeApplePay" product.
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    from: 23.0.0

targets:
  Slate:
    type: application
    platform: iOS
    sources:
      - path: Slate
      - path: Shared
    dependencies:
      - target: SlateWidgets
      - package: Supabase
      - package: Stripe
        product: StripeApplePay
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.slate
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Slate
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        StripePublishableKey: $(STRIPE_PUBLISHABLE_KEY)
        ApplePayMerchantID: $(APPLE_PAY_MERCHANT_ID)
        SlateAppGroup: $(APP_GROUP_ID)
        NSCalendarsFullAccessUsageDescription: Slate reads your calendars so clients can't book times when you're busy. Only the start and end times of busy events are shared, never their titles or details.
        NSCalendarsWriteOnlyAccessUsageDescription: Slate adds your bookings to your calendar.
        NSLocationWhenInUseUsageDescription: Slate uses your approximate location, once, to show creators who work near you. It is rounded to your city and never shared with other people.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.slate
            CFBundleURLSchemes:
              - slate

  # The home screen and lock screen widget (the next booking). It reads a small file the app writes into the App Group.
  SlateWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SlateWidgets
      - path: Shared
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.slate.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Config/SlateWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Config/SlateWidgets-Info.plist
      properties:
        CFBundleDisplayName: Slate
        SlateAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SlateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SlateTests
    dependencies:
      - target: Slate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.slate.tests

schemes:
  Slate:
    build:
      targets:
        Slate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SlateTests
