name: Slate

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  Slate:
    type: application
    platform: iOS
    sources:
      - path: Slate
    dependencies:
      - package: Supabase
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.slate
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Config/Slate.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Slate
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        NSCalendarsFullAccessUsageDescription: Slate reads your calendars so clients can't book times when you're busy. Only the start and end times of busy events are shared, never their titles or details.
        NSCalendarsWriteOnlyAccessUsageDescription: Slate adds your bookings to your calendar.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.slate
            CFBundleURLSchemes:
              - slate

  SlateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SlateTests
    dependencies:
      - target: Slate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.slate.tests

schemes:
  Slate:
    build:
      targets:
        Slate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SlateTests
